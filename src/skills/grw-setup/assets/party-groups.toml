# Gruppi tematici di bmad-party-mode installati dal setup di Guardrails Web Experience.
#
# GENERATO da tools/build_modules.py: i membri sono ridotti alle figure che
# questo modulo installa. Le figure delle altre aree Guardrails restano fuori.
#
# Sono override di team in {project-root}/_bmad/custom/bmad-party-mode.toml:
# nessun default_party viene imposto, ogni gruppo si convoca con `--party <id>`.

[[workflow.party_groups]]
id = "grl-web"
name = "Guardrails Web Experience"
scene = "Redazione digitale davanti a una pagina: Nora controlla domanda, findability e misurazione; Iris attacca i cliché visivi; Milo controlla che il modello dei contenuti resti a componenti. Se è installato BMM, Sally può entrare per difendere il flusso utente; la stanza deve consegnare mosse concrete, non gusto personale."
members = ["grl-agent-seo", "grl-agent-ui-critic", "bmad-agent-ux-designer"]
memory = false

[[workflow.party_groups]]
id = "grl-paid-media"
name = "Guardrails Paid Media"
scene = "Tavolo media buying: Dalia parte dall'obiettivo e dalla conversione che il business riconosce davvero; Nora separa Search organica da paid, Iris controlla creatività e landing, Vera ferma dati e consenso fuori perimetro, Aldo blocca claim o diritti non dimostrati. Nessuno sposta budget o pubblica: si discutono evidenze, test, limiti, approvazioni e rollback."
members = ["grl-agent-ads", "grl-agent-seo", "grl-agent-ui-critic", "bmad-agent-ux-designer"]
memory = false

[[workflow.party_groups]]
id = "grl-automation"
name = "Guardrails Automation Room"
scene = "Sala di regia: Mary, John e Sally chiariscono obiettivo e priorità; Enzo cerca il passaggio ripetitivo che si può automatizzare senza aggiungere magia; Kai, Nils, Otto e Bruno verificano rischio, obblighi, confini e operabilità; Vera, Aldo, Marta, Iris, Livia, Milo, Nora e Dalia entrano solo se il dominio lo richiede. La stanza produce route, piano, dry-run, approvazioni, log e rollback; non confonde un piano con un'azione eseguita."
members = ["bmad-agent-analyst", "bmad-agent-pm", "bmad-agent-dev", "bmad-agent-ux-designer", "grl-agent-ui-critic", "grl-agent-seo", "grl-agent-ads"]
memory = false
