# Manifesto del modulo Guardrails Web Experience (grw).
#
# GENERATO da tools/build_modules.py nel repository bmad-module-guardrails.
# Non modificare qui: le modifiche si fanno nella fonte e poi si rigenera.
#
# Questa è la copia che legge l'installer BMad: la cerca in src/module.yaml.
# La copia in src/skills/grw-setup/assets/module.yaml resta per
# l'installazione manuale via grw-setup: le due sono identiche.

code: grw
name: Guardrails Web Experience
description: "Due figure di presidio su qualità visiva dell'interfaccia e SEO, più il workflow che costruisce landing page e siti dal brief di conversione al progetto. Contro le pagine che sembrano generate e le promesse di ranking."
module_version: 1.17.0
default_selected: false

module_greeting: >
  Guardrails Web Experience è installato: Iris (design critic) e Nora (seo strategist & search systems auditor) entrano nel roster e si possono convocare per nome.

  Passo successivo consigliato: esegui `grw-profile`. Senza il profilo di progetto le figure partono cieche e parlano per luoghi comuni; con il profilo sanno cosa non ti riguarda, che è il loro output più utile.

  Il profilo vive in `_bmad/memory/grl-shared/` ed è condiviso con gli altri moduli Guardrails: si compila una volta sola.

# --- Contesto di esecuzione ---------------------------------------------------
# Nessuna variabile di configurazione del modulo: tutto il contesto vive nella
# memoria condivisa del progetto (_bmad/memory/grl-shared/project-profile.md).
# La severità si deriva dalla criticità dichiarata nel profilo di progetto.
#
# La cartella della memoria condivisa NON va creata dal setup: la crea
# grw-profile alla prima esecuzione.
#
# Questo modulo è una porzione del bundle Guardrails (`grl`). Bundle e moduli
# tematici installano skill con lo stesso nome: non vanno installati insieme
# nello stesso progetto.

post-install-notes: >
  Primo passo: esegui `grw-profile`. Sono otto campi, pochi minuti, quasi tutti
  pre-compilati leggendo il repository; l'unico che devi dichiarare tu è la criticità
  del progetto (hobby/prototipo · interno · produzione con clienti · regolamentato),
  perché è quella che regola quanto sarà severa ogni figura.

  Poi puoi chiamare una figura per nome, oppure usare `grw-board` per farle
  guardare tutte insieme lo stesso artefatto.

  Se ti servono anche le figure delle altre aree, il bundle completo `grl` le
  contiene tutte: https://github.com/mlarese/bmad-module-guardrails

# --- Roster degli agenti -----------------------------------------------------
# `code`, `name`, `title`, `icon` e `description` sono copiati verbatim dal blocco
# [agent] del customize.toml di ciascuna skill: quelli restano la fonte di verità.

agents:
  - code: grl-agent-ui-critic
    module: grw
    team: software-development
    name: Iris
    title: Design Critic
    icon: 👁️
    description: 'Guarda una landing o una schermata e dice subito dove l''ha già vista: hero centrato in gradiente, tre card con icona, Inter a peso 600, blu-viola ovunque. Difende l''identità visiva contro il template — tipografia, palette, densità, layout — e non stronca mai senza dare la deviazione concreta. Parla come una critica in redazione davanti a un menabò: una frase per il difetto, una per l''alternativa, sempre con dei valori dentro.'

  - code: grl-agent-seo
    module: grw
    team: software-development
    name: Nora
    title: SEO Strategist & Search Systems Auditor
    icon: 🔎
    description: Distingue domanda, intento, crawl, indicizzazione, contenuto, dati strutturati e misurazione, verifica sempre live le regole SEO e trasforma ogni diagnosi in una modifica verificabile senza promettere ranking.
